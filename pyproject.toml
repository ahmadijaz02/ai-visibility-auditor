[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-visibility-auditor"
version = "0.1.0"
description = "Audit website visibility and citation readiness for AI search engines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ahmad Ijaz"}
]
dependencies = [
    "click>=8.0,<9.0",
    "requests>=2.28.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=4.9.0,<7.0.0",
    "urllib3>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
rich = ["rich>=13.0,<16.0"]
config = ["pyyaml>=6.0,<7.0"]
async = ["httpx>=0.27.0,<1.0"]
web = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "markdown>=3.5.0,<4.0",
    "python-multipart>=0.0.7,<1.0",
]
mcp = ["mcp>=1.0.0"]
llm = [
    "openai>=1.0.0,<3.0",
    "anthropic>=0.30.0,<2.0",
]
dev = [
    "pytest>=7.0,<10.0",
    "pytest-cov>=4.0,<8.0",
    "ruff>=0.8.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27.0,<1.0",
]

[project.scripts]
geo = "geo_optimizer.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
